## TheHive 5 - minimal single-node configuration for the SOC lab.
## Data lives in Cassandra; the search index and attachments are stored locally.

db.janusgraph {
  storage {
    backend = cql
    hostname = ["cassandra"]
    cql.cluster-name = thehive
  }
  index.search {
    backend = lucene
    directory = /opt/thp/thehive/index
  }
}

storage {
  provider = localfs
  localfs.location = /opt/thp/thehive/data
}

## Change this to a long random string before any real use.
play.http.secret.key = "CHANGE-ME-to-a-long-random-secret"

## The Wazuh->Shuffle->TheHive integration authenticates with an API key
## created in the UI (Organisation -> service account). No secret goes in this file.
